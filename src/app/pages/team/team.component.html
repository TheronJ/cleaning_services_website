<section id="team" class="ui-section ui-anchor">
  <div class="ui-container">
    <app-section-header kicker="Team" title="CHECK OUR TEAM"></app-section-header>

    <div class="ui-grid-2">
      <div class="team-card ui-card" *ngFor="let m of team">
        <div class="avatar">
          <img [src]="m.img" [alt]="m.name">
        </div>
        <div>
          <h3>{{ m.name }}</h3>
          <div class="role">{{ m.role }}</div>
          <p>{{ m.bio }}</p>
          <div class="social">
            <a href="#" aria-label="X">X</a>
            <a href="#" aria-label="Facebook">f</a>
            <a href="#" aria-label="Instagram">IG</a>
            <a href="#" aria-label="LinkedIn">in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
